<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Analytics-Admin Dashboard</title>
        <link rel="stylesheet" href="style2.css">
    </head>
    <body>
        <!--sidebar-->
        <aside class="sidebar">
            <h2>Admin Panel</h2> 
            <nav>
                <a class="active" href="dashboard.html">Dashboard</a>
                <a class="active" href="users.html">Users</a>
                <a class="active" href="products.html">Products</a>
                <a class="active" href="orders.html">Orders</a>
                <a class="active" href="analytics.html">Analytics</a>
                <a class="active" href="settings.html">Settings</a>
            </nav>
        </aside>
        <!--Main Content-->
        <main class="main-content">
            <!--navbar-->
            <header class="navbar">
                <h1>Analytics</h1>
                <div class="profile">
                    Admin 🙎🏻‍♂️
                </div>
            </header>
            <!--Statistics Cards-->
            <section class="cards">
                <div class="card">
                    <h3>Total Sales</h3>
                    <p>₹10,50,000</p>
                </div>
                <div class="card">
                    <h3>Monthly Orders</h3>
                    <p>850</p>
                </div>
                <div class="card">
                    <h3>Growth</h3>
                    <p>25%</p>
                </div>
            </section>
            <!--Sales-->
            <section class="sales">
                <h2> Monthly Sales</h2>
            </section>
            <div class="chart">
                <div class="bar" style="height:40%">
                    <span>Jan</span>
                </div>
                <div class="bar" style="height:60%">
                    <span>Feb</span>
                </div>
                <div class="bar" style="height:80%">
                    <span>Mar</span>
                </div>
                <div class="bar" style="height:50%">
                    <span>Apr</span>
                </div>
                <div class="bar" style="height:90%">
                    <span>May</span>
                </div>
                <div class="bar" style="height:70%">
                    <span>Jun</span>
                </div>
            </div>
        </main>
    </body>
</html>
